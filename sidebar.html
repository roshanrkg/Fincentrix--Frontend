<!-- =========================================
     FINCENTRIX SHARED SIDEBAR TEMPLATE
     (Can be included or injected via sidebar.js)
========================================== -->
<aside id="sidebar"
    class="sidebar fixed top-0 left-0 z-[100] h-screen w-[265px] -translate-x-full sm:translate-x-0 [&.active]:translate-x-0 transition-transform duration-300 ease-out bg-navy-darker border-r border-white/10 flex flex-col justify-between p-5 text-white shadow-2xl">

    <div class="sidebar-top flex flex-col">
        <!-- BRAND HEADER -->
        <div class="sidebar-header flex items-center justify-between pb-5 border-b border-white/10">
            <a href="dashboard2.html" class="brand flex items-center gap-2.5 text-xl font-extrabold italic text-white tracking-tight">
                <span class="brand-logo grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-[#4778ff] to-[#2450e8] text-2xl font-extrabold italic text-white shadow-lg">
                    F
                </span>
                <span>Fincentrix</span>
            </a>

            <button id="sidebarClose" class="sidebar-close sm:hidden grid h-8 w-8 place-items-center rounded-lg bg-white/5 text-white/70 hover:text-white cursor-pointer" aria-label="Close menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- NAVIGATION LINKS -->
        <nav class="sidebar-nav mt-6 flex flex-col gap-1.5" aria-label="Main Navigation">
            <a href="dashboard2.html" class="nav-link relative flex h-[48px] items-center gap-[14px] rounded-xl px-[14px] text-[13px] font-medium transition-all duration-300 border border-transparent hover:text-white hover:bg-[#315cff]/[0.08] hover:border-[#315cff]/25 group" data-page="home">
                <i class="fa-solid fa-house text-base w-[20px] text-center"></i>
                <span>Dashboard</span>
            </a>

            <a href="loans.html" class="nav-link relative flex h-[48px] items-center gap-[14px] rounded-xl px-[14px] text-[13px] font-medium transition-all duration-300 border border-transparent hover:text-white hover:bg-[#315cff]/[0.08] hover:border-[#315cff]/25 group" data-page="loans">
                <i class="fa-solid fa-hand-holding-dollar text-base w-[20px] text-center"></i>
                <span>Loan Products</span>
                <span class="nav-count ml-auto rounded-full bg-white/10 px-2 py-0.5 text-[10px] font-bold text-white">
                    10
                </span>
            </a>

            <a href="applications.html" class="nav-link relative flex h-[48px] items-center gap-[14px] rounded-xl px-[14px] text-[13px] font-medium transition-all duration-300 border border-transparent hover:text-white hover:bg-[#315cff]/[0.08] hover:border-[#315cff]/25 group" data-page="applications">
                <i class="fa-solid fa-list-check text-base w-[20px] text-center"></i>
                <span>My Applications</span>
                <span id="sidebarApplicationsBadge" class="nav-count ml-auto rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/30 px-2 py-0.5 text-[10px] font-bold hidden">
                    0
                </span>
            </a>

            <a href="profile.html" class="nav-link relative flex h-[48px] items-center gap-[14px] rounded-xl px-[14px] text-[13px] font-medium transition-all duration-300 border border-transparent hover:text-white hover:bg-[#315cff]/[0.08] hover:border-[#315cff]/25 group" data-page="profile">
                <i class="fa-solid fa-user text-base w-[20px] text-center"></i>
                <span>My Profile</span>
            </a>

            <a href="dashboard2.html#loanTypes" class="nav-link relative flex h-[48px] items-center gap-[14px] rounded-xl px-[14px] text-[13px] font-medium transition-all duration-300 border border-transparent hover:text-white hover:bg-[#315cff]/[0.08] hover:border-[#315cff]/25 group" data-page="settings">
                <i class="fa-solid fa-gear text-base w-[20px] text-center"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <!-- SIDEBAR FOOTER -->
    <div class="sidebar-footer flex flex-col gap-4">
        <!-- USER PROFILE -->
        <div class="user-profile flex items-center gap-[11px] border-t border-white/10 pt-[17px]">
            <div id="sidebarUserAvatar" class="user-avatar grid h-[39px] w-[39px] shrink-0 place-items-center rounded-full border-2 border-white/10 bg-gradient-to-br from-[#4778ff] to-[#2449c9] text-[11px] font-bold text-white uppercase">
                FX
            </div>
            <div class="user-info min-w-0 flex-1">
                <h4 id="sidebarUserName" class="text-[11px] font-bold text-white truncate">
                    User Profile
                </h4>
                <p id="sidebarUserRole" class="mt-0.5 text-[9px] text-[#8295b4] truncate">
                    Customer
                </p>
            </div>
            <button id="logoutButton"
                class="profile-button ml-auto border-0 bg-transparent text-[#9baecc] hover:text-red-400 transition-colors cursor-pointer text-sm font-semibold p-1.5 rounded-lg hover:bg-white/5"
                title="Log Out"
                aria-label="Log Out">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </div>
    </div>
</aside>

<!-- SIDEBAR OVERLAY -->
<div id="sidebarOverlay" class="sidebar-overlay fixed inset-0 z-[90] bg-[#050f23]/60 opacity-0 invisible transition-all duration-300 [&.active]:opacity-100 [&.active]:visible sm:hidden"></div>
